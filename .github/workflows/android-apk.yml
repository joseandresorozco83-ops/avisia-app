name: Build AVISIA Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build web assets
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug || ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../AVISIA-v5.6.0.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../AVISIA-v5.6.2.apk

      - name: Upload AVISIA-debug.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AVISIA-debug-apk
          path: AVISIA-v5.6.0.apk
          if-no-files-found: error

      - name: Publish Direct Download APK to GitHub Releases (v5.6.0)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.6.0
          name: AVISIA v5.6.2 Android APK (UAM Managua)
          body: |
            Descarga directa del instalador Android (`AVISIA-v5.6.0.apk` / `AVISIA-v5.6.2.apk`) sincronizado 1:1 con la versión Web:
            - Corregido error `Cannot read properties of undefined (reading 'getVoices')` en Android WebView
            - Ícono oficial de AVISIA en el lanzador y pantalla completa de carga (Splash Screen)
            - 6 modos contextuales (1. Oficina, 2. Casa, 3. Calle, 4. Lector de Billetes, 5. Detallado, 6. Discreto)
            - Recalibración 3D de distancias en pasos + regulación de voz por sensores
            - Lector de billetes en Córdobas (C$10 a C$1000) y Dólares ($1 a $100)
          files: |
            AVISIA-v5.6.0.apk
            AVISIA-v5.6.2.apk
          prerelease: false
